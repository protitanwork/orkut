<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="styles/reset.css">
   <link rel="stylesheet" href="styles/login.css">
   <link rel="stylesheet" href="styles/login-responsive.css">
   <title>ORKUT-CLONE</title>
</head>

<body>

   <div class="logo">
      <img src="assets/orkutLogo.png" alt="logo">
   </div>

   <div class="container">
      <div class="fields">
         <div class="fields__title">
            <p id="field__title">Acesse seu
               <span class="pink-font">orkut</span>
               com sua conta
               <span style="color: rgba(108, 108, 235, 0.842);">G</span><span
                  style="color:rgba(207, 81, 186, 0.911) ;">o</span><span
                  style="color: rgb(226, 224, 107);">o</span><span style="color: rgb(154, 154, 160);">g</span><span
                  style="color: rgb(12, 12, 207);">l</span><span style="color: rgb(240, 20, 20);">e</span>
               !
            </p>
         </div>

         <div class="fields__textbox">
            <input type="email" placeholder="E-mail ou número de celular " id="field__email">
            <input type="password" placeholder="Digite sua senha" id="field__pass">
         </div>

         <div class="fields__remember">
            <input type="checkbox" name="" id="field__remember">
            <label for="field__remember">Lembrar sempre do meu acesso</label>
         </div>

         <div class="fields__buttons">
            <button id="btnLogin">ENTRAR</button>
         </div>

         <div class="fields__recovery">
            <a href="#">Esqueci senha ou e-mail</a>
         </div>

         <div class="fields__create">
            <a href="#">Não tem conta ?<span class="pink-font"> Criar agora</span></a>
         </div>

      </div>
   </div>

</body>

</html>
